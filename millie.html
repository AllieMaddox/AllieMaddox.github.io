<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millie's Chore Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff7ef;
    --card: #ffffff;
    --ink: #3b2a4a;
    --muted: #8a7a96;
    --pink: #ff6fa5;
    --purple: #8b5cf6;
    --green: #22c55e;
    --green-dark: #15803d;
    --yellow: #ffd166;
    --line: #f1e4f5;
    --shadow: 0 6px 18px rgba(139, 92, 246, .12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Baloo 2", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
  header { text-align: center; margin: 8px 0 16px; }
  h1 { font-size: 2.2rem; margin: 0; color: var(--purple); line-height: 1.1; }
  h1 span { color: var(--pink); }
  .sub { color: var(--muted); margin: 4px 0 0; }

  .bank {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #fff;
    border-radius: 24px;
    padding: 20px;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .bank .label { font-size: 1.1rem; opacity: .95; }
  .bank .amount { font-size: 3.6rem; font-weight: 800; line-height: 1; margin: 6px 0 10px; }
  .bank .amount.bump { animation: bump .45s ease; }
  @keyframes bump { 40% { transform: scale(1.15); } }
  .bank .count { opacity: .9; margin-bottom: 14px; }
  .btn {
    font: inherit; font-weight: 700; border: 0; border-radius: 999px;
    padding: 10px 18px; cursor: pointer; font-size: 1rem;
  }
  .btn-pay { background: var(--yellow); color: var(--ink); font-size: 1.1rem; padding: 12px 26px; }
  .btn-pay:disabled { opacity: .5; cursor: not-allowed; }

  h2 { font-size: 1.4rem; margin: 28px 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .link { background: none; border: 0; color: var(--purple); font: inherit; font-weight: 700; cursor: pointer; font-size: 1rem; }

  .menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .chore {
    background: var(--card); border: 2px solid var(--line); border-radius: 18px;
    padding: 14px 10px; text-align: center; cursor: pointer; box-shadow: var(--shadow);
    font: inherit; color: inherit; transition: transform .1s, border-color .2s;
  }
  .chore:active { transform: scale(.96); }
  .chore:hover { border-color: var(--pink); }
  .chore .emoji { font-size: 2rem; display: block; }
  .chore .name { font-weight: 700; display: block; line-height: 1.2; margin: 4px 0; }
  .chore .price { display: inline-block; background: #e9fbe9; color: var(--green-dark); font-weight: 800; border-radius: 999px; padding: 2px 12px; }

  .list { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .what { flex: 1; min-width: 0; }
  .row .what small { color: var(--muted); display: block; }
  .row .amt { font-weight: 800; color: var(--green-dark); }
  .x { background: #fdecef; color: #c2185b; border: 0; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: 800; flex: none; }
  .empty { padding: 18px; text-align: center; color: var(--muted); }

  .editor .row input { font: inherit; border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; min-width: 0; color: var(--ink); background: #fff; }
  .editor .row { gap: 6px; padding: 10px; }
  .editor .e-emoji { width: 44px; text-align: center; padding: 6px 2px; }
  .editor .e-name { flex: 1; }
  .editor .e-price { width: 64px; }
  .grip {
    flex: none; width: 30px; height: 40px; border: 0; border-radius: 8px; background: #f3edff; color: var(--purple);
    font-size: 1.2rem; line-height: 1; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; padding: 0;
  }
  .editor .row { transition: background .15s, box-shadow .15s; background: var(--card); position: relative; }
  .editor .row.dragging { background: #f7f2ff; box-shadow: 0 8px 22px rgba(139, 92, 246, .3); z-index: 2; }
  .editor .row.dragging .grip { cursor: grabbing; background: var(--purple); color: #fff; }
  .editor.is-dragging, .editor.is-dragging * { user-select: none; -webkit-user-select: none; }
  .hint { padding: 10px 14px 0; color: var(--muted); font-size: .95rem; }
  .btn-add { background: var(--purple); color: #fff; margin: 12px 14px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 700;
    transition: transform .3s; z-index: 10; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast button { background: var(--yellow); color: var(--ink); border: 0; border-radius: 999px; padding: 4px 12px; font: inherit; font-weight: 700; cursor: pointer; }

  .coin { position: fixed; font-size: 2rem; pointer-events: none; z-index: 20; animation: fly .9s ease-in forwards; }
  @keyframes fly { to { transform: translateY(-60vh) scale(.5); opacity: 0; } }
  .chore .nsteps { display: block; color: var(--muted); font-size: .85rem; margin-top: 4px; }

  .editor .row { flex-wrap: wrap; }
  .steps-toggle {
    flex-basis: 100%; text-align: left; background: none; border: 0; padding: 0 0 0 36px;
    color: var(--purple); font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer;
  }
  .e-steps {
    flex-basis: 100%; margin-left: 36px; width: calc(100% - 36px); min-height: 110px; resize: vertical;
    font: inherit; font-size: 1rem; border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--ink); background: #fff;
  }
  .e-steps-hint { flex-basis: 100%; margin-left: 36px; color: var(--muted); font-size: .85rem; margin-top: -2px; }

  .sheet-bg {
    position: fixed; inset: 0; background: rgba(59, 42, 74, .45); z-index: 30;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    background: var(--bg); width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
    border-radius: 26px 26px 0 0; padding: 22px 18px calc(20px + env(safe-area-inset-bottom));
    text-align: center; animation: up .25s ease;
  }
  @media (min-width: 560px) { .sheet-bg { align-items: center; } .sheet { border-radius: 26px; } }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .s-emoji { font-size: 3.2rem; line-height: 1; }
  .sheet h3 { font-size: 1.7rem; margin: 6px 0 4px; color: var(--purple); line-height: 1.15; }
  .s-price { display: inline-block; background: #e9fbe9; color: var(--green-dark); font-weight: 800; border-radius: 999px; padding: 2px 14px; font-size: 1.1rem; }
  .s-label { text-align: left; font-weight: 700; margin: 18px 4px 8px; display: flex; justify-content: space-between; }
  .s-label span { color: var(--muted); font-weight: 500; }
  .steps { list-style: none; margin: 0; padding: 0; text-align: left; }
  .step {
    width: 100%; display: flex; align-items: center; gap: 12px; background: var(--card); border: 2px solid var(--line);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; font: inherit; font-size: 1.1rem; color: var(--ink); cursor: pointer; text-align: left;
  }
  .step .box {
    flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--purple);
    display: grid; place-items: center; color: #fff; font-weight: 800;
  }
  .step.checked { border-color: var(--green); background: #f0fdf4; }
  .step.checked .box { background: var(--green); border-color: var(--green); }
  .step.checked .txt { text-decoration: line-through; color: var(--muted); }
  .no-steps { color: var(--muted); margin: 16px 0 4px; }
  .btn-done { background: var(--green); color: #fff; width: 100%; font-size: 1.2rem; padding: 14px; margin-top: 14px; }
  .btn-done.ready { animation: pulse 1s ease infinite; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .sheet .link { margin-top: 10px; padding: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Millie's <span>Chore Chart</span></h1>
    <p class="sub">Tap a chore to see what to do, then watch your bank grow!</p>
  </header>

  <section class="bank">
    <div class="label">💰 We owe Millie</div>
    <div class="amount" id="owed">$0.00</div>
    <div class="count" id="count">No chores yet this week</div>
    <button class="btn btn-pay" id="payBtn">Pay Millie &amp; start new week</button>
  </section>

  <h2>Chore Menu <button class="link" id="editToggle">✏️ Edit menu</button></h2>
  <div class="menu" id="menu"></div>

  <div class="list editor hidden" id="editor"></div>

  <h2>This Week</h2>
  <div class="list" id="week"></div>

  <h2>Paydays</h2>
  <div class="list" id="paid"></div>
</div>

<div class="sheet-bg hidden" id="sheet">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="s-emoji" id="sheetEmoji"></div>
    <h3 id="sheetTitle"></h3>
    <div class="s-price" id="sheetPrice"></div>
    <div id="sheetBody"></div>
    <button class="btn btn-done" id="sheetDone"></button>
    <button class="link" id="sheetClose">Not yet</button>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function () {
  var KEY = 'millie-chore-chart-v1';
  var DEFAULT_CHORES = [
    { id: 'c1', emoji: '🛏️', name: 'Make bed', price: 0.50 },
    { id: 'c2', emoji: '🧸', name: 'Clean up toys', price: 0.50 },
    { id: 'c3', emoji: '🍽️', name: 'Set the table', price: 0.50 },
    { id: 'c4', emoji: '🧺', name: 'Put away laundry', price: 1.00 },
    { id: 'c5', emoji: '🐶', name: 'Feed the pet', price: 0.50 },
    { id: 'c6', emoji: '🗑️', name: 'Take out trash', price: 1.00 },
    { id: 'c7', emoji: '🪴', name: 'Water plants', price: 0.50 },
    { id: 'c8', emoji: '🧹', name: 'Sweep the floor', price: 1.00 },
    { id: 'c9', emoji: '🚗', name: 'Help wash the car', price: 2.00 },
    { id: 'c10', emoji: '🧽', name: 'Wipe the counters', price: 0.75 }
  ];
  var DEFAULT_STEPS = {
    'make bed': ['Pull the sheet up flat', 'Pull the blanket up to the pillow', 'Smooth out the wrinkles', 'Put pillows at the top', 'Line up stuffed animals'],
    'clean up toys': ['Pick up toys from the floor', 'Put each toy in its bin or spot', 'Put books back on the shelf', 'Check under the bed and couch'],
    'set the table': ['Put a placemat at each seat', 'Put a plate on each placemat', 'Fork on the left, knife and spoon on the right', 'Fold a napkin by each plate', 'Put a cup at each seat'],
    'put away laundry': ['Sort clothes into piles (shirts, pants, socks, PJs)', 'Match up socks', 'Fold shirts and pants', 'Put each pile in the right drawer', 'Hang up anything that goes on a hanger'],
    'feed the pet': ['Scoop the right amount of food into the bowl', 'Rinse the water bowl', 'Fill it with fresh water', 'Put the food bag away', 'Wipe up any spills'],
    'take out trash': ['Check the bathroom and bedroom trash cans', 'Empty them into the big trash bag', 'Tie the big bag closed', 'Carry it to the outside bin', 'Put a new bag in the kitchen can'],
    'water plants': ['Fill the watering can', 'Feel the soil — water it if it’s dry', 'Pour slowly until the soil is wet', 'Wipe up any drips', 'Put the watering can back'],
    'sweep the floor': ['Move chairs out of the way', 'Sweep from the edges to the middle', 'Sweep the pile into the dustpan', 'Dump it in the trash', 'Put chairs and broom back'],
    'help wash the car': ['Fill the bucket with soapy water', 'Rinse the car with the hose', 'Scrub with the sponge, top to bottom', 'Rinse off all the soap', 'Dry it with a towel'],
    'wipe the counters': ['Clear things off the counter', 'Spray the counter', 'Wipe crumbs into your hand or the sink', 'Wipe it dry', 'Put things back neatly']
  };
  DEFAULT_CHORES.forEach(function (c) { c.steps = DEFAULT_STEPS[c.name.toLowerCase()].slice(); });
  var BATHROOM = {
    id: 'bath', emoji: '🛁', name: 'Clean bathroom', price: 1.00,
    steps: ['Wipe counters', 'Put toothbrushes away', 'Pick up floor', 'Put toys in basket']
  };

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.chores) return s;
    } catch (e) {}
    return { chores: DEFAULT_CHORES.slice(), earned: [], payouts: [] };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = load();
  // One-time update: add the bathroom chore with its steps
  if (!state.addedBathroom) {
    var bath = state.chores.find(function (c) { return /bathroom/i.test(c.name); });
    if (!bath) state.chores.unshift(JSON.parse(JSON.stringify(BATHROOM)));
    else if (!bath.steps || !bath.steps.length) bath.steps = BATHROOM.steps.slice();
    state.addedBathroom = true;
    save();
  }
  // One-time update: fill in steps for starter chores that don't have any
  if (!state.addedDefaultSteps) {
    state.chores.forEach(function (c) {
      var d = DEFAULT_STEPS[String(c.name).trim().toLowerCase()];
      if (d && !(c.steps && c.steps.length)) c.steps = d.slice();
    });
    state.addedDefaultSteps = true;
    save();
  }
  var openSteps = {};
  var editing = false;
  var $ = function (id) { return document.getElementById(id); };
  var money = function (n) { return '$' + (Math.round(n * 100) / 100).toFixed(2); };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  var stepsOf = function (c) { return (c.steps || []).filter(function (x) { return x.trim(); }); };
  var when = function (t) {
    return new Date(t).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  };
  var total = function () { return state.earned.reduce(function (a, e) { return a + e.price; }, 0); };

  function render() {
    var t = total();
    $('owed').textContent = money(t);
    var n = state.earned.length;
    $('count').textContent = n ? n + ' chore' + (n === 1 ? '' : 's') + ' done this week 🎉' : 'No chores yet this week';
    $('payBtn').disabled = n === 0;

    $('menu').innerHTML = state.chores.map(function (c) {
      return '<button class="chore" data-id="' + c.id + '"><span class="emoji">' + esc(c.emoji || '⭐') +
        '</span><span class="name">' + esc(c.name) + '</span><span class="price">' + money(c.price) + '</span>' +
        (stepsOf(c).length ? '<span class="nsteps">📋 ' + stepsOf(c).length + ' step' + (stepsOf(c).length === 1 ? '' : 's') + '</span>' : '') +
        '</button>';
    }).join('') || '<div class="empty">No chores on the menu. Tap “Edit menu” to add some.</div>';

    $('week').innerHTML = state.earned.slice().reverse().map(function (e) {
      return '<div class="row"><span>' + esc(e.emoji || '⭐') + '</span><div class="what">' + esc(e.name) +
        '<small>' + when(e.at) + '</small></div><span class="amt">+' + money(e.price) +
        '</span><button class="x" title="Remove" data-earned="' + e.id + '">✕</button></div>';
    }).join('') || '<div class="empty">Nothing yet — go pick a chore!</div>';

    $('paid').innerHTML = state.payouts.slice().reverse().map(function (p) {
      return '<div class="row"><span>💵</span><div class="what">Paid ' + p.count + ' chore' + (p.count === 1 ? '' : 's') +
        '<small>' + when(p.at) + '</small></div><span class="amt">' + money(p.amount) + '</span></div>';
    }).join('') || '<div class="empty">No paydays yet.</div>';

    $('editToggle').textContent = editing ? '✅ Done editing' : '✏️ Edit menu';
    $('editor').classList.toggle('hidden', !editing);
    if (editing) renderEditor();
  }

  function renderEditor() {
    $('editor').innerHTML = '<div class="hint">Drag ⠿ to reorder chores.</div>' + state.chores.map(function (c) {
      return '<div class="row" data-id="' + c.id + '">' +
        '<button class="grip" title="Drag to reorder" aria-label="Drag to reorder ' + esc(c.name) + ' (or use arrow keys)">⠿</button>' +
        '<input class="e-emoji" value="' + esc(c.emoji || '') + '" aria-label="Emoji">' +
        '<input class="e-name" value="' + esc(c.name) + '" aria-label="Chore name">' +
        '<input class="e-price" type="number" min="0" step="0.25" inputmode="decimal" value="' + c.price.toFixed(2) + '" aria-label="Price">' +
        '<button class="x" title="Delete chore" data-del="' + c.id + '">✕</button>' +
        stepsEditor(c) + '</div>';
    }).join('') + '<button class="btn btn-add" id="addChore">+ Add a chore</button>';
  }

  function stepsLabel(c) {
    var n = stepsOf(c).length;
    return (openSteps[c.id] ? '▾ ' : '▸ ') + '📝 ' + (n ? 'Steps (' + n + ')' : 'Add steps');
  }
  function stepsEditor(c) {
    var open = !!openSteps[c.id];
    return '<button class="steps-toggle" data-steps="' + c.id + '" aria-expanded="' + open + '">' + stepsLabel(c) + '</button>' +
      (open ? '<textarea class="e-steps" aria-label="Steps for ' + esc(c.name) + '" placeholder="One step per line, e.g.&#10;Wipe counters&#10;Put toothbrushes away">' +
        esc((c.steps || []).join('\n')) + '</textarea><div class="e-steps-hint">One step per line.</div>' : '');
  }

  // ---- Chore details sheet ----
  var sheetChore = null;
  function openSheet(c) {
    sheetChore = c;
    var steps = stepsOf(c);
    $('sheetEmoji').textContent = c.emoji || '⭐';
    $('sheetTitle').textContent = c.name;
    $('sheetPrice').textContent = money(c.price);
    $('sheetBody').innerHTML = steps.length
      ? '<div class="s-label">What to do <span id="sheetProgress"></span></div><ul class="steps">' +
        steps.map(function (st) {
          return '<li><button class="step" aria-pressed="false"><span class="box" aria-hidden="true">✓</span><span class="txt">' + esc(st) + '</span></button></li>';
        }).join('') + '</ul>'
      : '<p class="no-steps">No steps written for this chore yet.</p>';
    $('sheetDone').textContent = '✅ I did it! +' + money(c.price);
    updateProgress();
    $('sheet').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    $('sheetDone').focus({ preventScroll: true });
  }
  function closeSheet() {
    $('sheet').classList.add('hidden');
    document.body.style.overflow = '';
    sheetChore = null;
  }
  function updateProgress() {
    var all = $('sheetBody').querySelectorAll('.step'), done = $('sheetBody').querySelectorAll('.step.checked');
    if ($('sheetProgress')) $('sheetProgress').textContent = done.length + ' of ' + all.length + ' done';
    $('sheetDone').classList.toggle('ready', all.length > 0 && done.length === all.length);
  }
  $('sheetBody').addEventListener('click', function (ev) {
    var st = ev.target.closest('.step');
    if (!st) return;
    st.classList.toggle('checked');
    st.setAttribute('aria-pressed', st.classList.contains('checked'));
    updateProgress();
  });
  $('sheetClose').onclick = closeSheet;
  $('sheet').addEventListener('click', function (ev) { if (ev.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && sheetChore) closeSheet(); });
  $('sheetDone').onclick = function () {
    var c = sheetChore;
    if (!c) return;
    var r = $('sheetDone').getBoundingClientRect();
    closeSheet();
    earn(c, r.left + r.width / 2, r.top);
  };

  var toastTimer, undoFn;
  function toast(msg, undo) {
    $('toastMsg').textContent = msg;
    undoFn = undo;
    $('toastUndo').style.display = undo ? '' : 'none';
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').classList.remove('show'); }, 4000);
  }
  $('toastUndo').onclick = function () {
    if (undoFn) undoFn();
    undoFn = null;
    $('toast').classList.remove('show');
  };

  function coin(x, y) {
    var el = document.createElement('div');
    el.className = 'coin'; el.textContent = '🪙';
    el.style.left = (x - 16) + 'px'; el.style.top = (y - 16) + 'px';
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1000);
  }

  $('menu').addEventListener('click', function (ev) {
    var b = ev.target.closest('.chore');
    if (!b) return;
    var c = state.chores.find(function (x) { return x.id === b.dataset.id; });
    if (c) openSheet(c);
  });

  function earn(c, x, y) {
    var entry = { id: uid(), name: c.name, emoji: c.emoji, price: c.price, at: Date.now() };
    state.earned.push(entry);
    save(); render();
    coin(x, y);
    var amt = $('owed'); amt.classList.remove('bump'); void amt.offsetWidth; amt.classList.add('bump');
    toast('Nice job! +' + money(c.price) + ' for ' + c.name, function () {
      state.earned = state.earned.filter(function (e) { return e.id !== entry.id; });
      save(); render();
    });
  }

  $('week').addEventListener('click', function (ev) {
    var id = ev.target.dataset.earned;
    if (!id) return;
    var idx = state.earned.findIndex(function (e) { return e.id === id; });
    if (idx < 0) return;
    var removed = state.earned.splice(idx, 1)[0];
    save(); render();
    toast('Removed ' + removed.name, function () {
      state.earned.splice(idx, 0, removed);
      save(); render();
    });
  });

  $('payBtn').onclick = function () {
    var t = total();
    if (!state.earned.length) return;
    if (!confirm('Pay Millie ' + money(t) + ' and start a new week?')) return;
    var payout = { id: uid(), amount: t, count: state.earned.length, at: Date.now(), items: state.earned };
    state.payouts.push(payout);
    state.earned = [];
    save(); render();
    toast('Paid ' + money(t) + '! 🎉 New week started.', function () {
      state.earned = payout.items;
      state.payouts = state.payouts.filter(function (p) { return p.id !== payout.id; });
      save(); render();
    });
  };

  $('editToggle').onclick = function () { editing = !editing; render(); };

  $('editor').addEventListener('input', function (ev) {
    var row = ev.target.closest('.row');
    if (!row) return;
    var c = state.chores.find(function (x) { return x.id === row.dataset.id; });
    if (!c) return;
    if (ev.target.classList.contains('e-emoji')) c.emoji = ev.target.value;
    if (ev.target.classList.contains('e-name')) c.name = ev.target.value;
    if (ev.target.classList.contains('e-price')) c.price = Math.max(0, parseFloat(ev.target.value) || 0);
    if (ev.target.classList.contains('e-steps')) {
      c.steps = ev.target.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
      row.querySelector('.steps-toggle').textContent = stepsLabel(c);
    }
    save();
    // Update the menu without rebuilding the editor (keeps focus while typing)
    var keep = editing; editing = false; render(); editing = keep;
    $('editToggle').textContent = '✅ Done editing'; $('editor').classList.remove('hidden');
  });

  $('editor').addEventListener('click', function (ev) {
    if (ev.target.id === 'addChore') {
      state.chores.push({ id: uid(), emoji: '⭐', name: 'New chore', price: 0.50 });
      save(); render();
      var inputs = $('editor').querySelectorAll('.e-name');
      var last = inputs[inputs.length - 1];
      if (last) { last.focus(); last.select(); }
      return;
    }
    var tog = ev.target.closest('.steps-toggle');
    if (tog) {
      var sid = tog.dataset.steps;
      openSteps[sid] = !openSteps[sid];
      render();
      var ta = $('editor').querySelector('.row[data-id="' + sid + '"] .e-steps');
      if (ta) ta.focus();
      return;
    }
    var id = ev.target.dataset.del;
    if (!id) return;
    var idx = state.chores.findIndex(function (c) { return c.id === id; });
    var removed = state.chores.splice(idx, 1)[0];
    save(); render();
    toast('Deleted ' + removed.name, function () {
      state.chores.splice(idx, 0, removed);
      save(); render();
    });
  });

  // ---- Drag and drop reordering (mouse + touch via pointer events) ----
  function saveOrderFromDom() {
    var ids = Array.prototype.map.call($('editor').querySelectorAll('.row'), function (r) { return r.dataset.id; });
    var byId = {};
    state.chores.forEach(function (c) { byId[c.id] = c; });
    state.chores = ids.map(function (id) { return byId[id]; }).filter(Boolean);
    save(); render();
  }

  var drag = null;
  $('editor').addEventListener('pointerdown', function (ev) {
    var grip = ev.target.closest('.grip');
    if (!grip || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    ev.preventDefault();
    var row = grip.closest('.row');
    drag = { row: row, id: row.dataset.id, y: ev.clientY, moved: false };
    row.classList.add('dragging');
    $('editor').classList.add('is-dragging');
    autoScroll();
  });

  function moveTo(y) {
    var row = drag.row, parent = row.parentNode;
    var prev = row.previousElementSibling, next = row.nextElementSibling;
    if (prev && prev.classList.contains('row') && y < prev.getBoundingClientRect().top + prev.offsetHeight / 2) {
      parent.insertBefore(row, prev); drag.moved = true;
    } else if (next && next.classList.contains('row') && y > next.getBoundingClientRect().top + next.offsetHeight / 2) {
      parent.insertBefore(next, row); drag.moved = true;
    }
  }

  window.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    drag.y = ev.clientY;
    moveTo(drag.y);
  });

  function autoScroll() {
    if (!drag) return;
    var edge = 70, h = window.innerHeight, dy = 0;
    if (drag.y < edge) dy = -Math.ceil((edge - drag.y) / 6);
    else if (drag.y > h - edge) dy = Math.ceil((drag.y - (h - edge)) / 6);
    if (dy) { window.scrollBy(0, dy); moveTo(drag.y); }
    requestAnimationFrame(autoScroll);
  }

  function endDrag() {
    if (!drag) return;
    var d = drag; drag = null;
    d.row.classList.remove('dragging');
    $('editor').classList.remove('is-dragging');
    if (d.moved) {
      saveOrderFromDom();
      var g = $('editor').querySelector('.row[data-id="' + d.id + '"] .grip');
      if (g) g.focus({ preventScroll: true });
    }
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  // Keyboard: focus the grip and press Up/Down to move
  $('editor').addEventListener('keydown', function (ev) {
    if (!ev.target.classList.contains('grip') || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown')) return;
    ev.preventDefault();
    var id = ev.target.closest('.row').dataset.id;
    var from = state.chores.findIndex(function (c) { return c.id === id; });
    var to = from + (ev.key === 'ArrowUp' ? -1 : 1);
    if (to < 0 || to >= state.chores.length) return;
    state.chores.splice(to, 0, state.chores.splice(from, 1)[0]);
    save(); render();
    var g = $('editor').querySelector('.row[data-id="' + id + '"] .grip');
    if (g) g.focus();
  });

  render();
})();
</script>
</body>
</html>
