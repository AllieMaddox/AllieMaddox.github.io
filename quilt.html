<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No-Spend Quilt</title>
<!-- Change app-version on every update so open pages show the "New version" banner -->
<meta name="app-version" content="2026-11-28-3">
<meta name="theme-color" content="#7a2e2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:wght@400;600&family=Satisfy&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ecdcbf;
    --card: #fffaf0;
    --ink: #3b2a20;
    --muted: #7d6650;
    --red: #7a2e2e;
    --hunter: #33503a;
    --wood: #6b4226;
    --aida: #f7f0de;
    --navy: #2c3a57;
    --gold: #d9a441;
    --muslin: #f4ead5;
    --line: #e2d3b7;
    --shadow: 0 6px 18px rgba(61, 43, 31, .14);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: "Lora", Georgia, serif;
    color: var(--ink);
    /* country calico wallpaper */
    background-color: var(--bg);
    background-image:
      radial-gradient(circle, var(--red) 1.6px, transparent 2.2px),
      radial-gradient(circle, var(--hunter) 1.1px, transparent 1.6px),
      radial-gradient(circle, #d8c29c 1.2px, transparent 1.7px);
    background-size: 26px 26px, 26px 26px, 13px 13px;
    background-position: 0 0, 13px 13px, 6px 0;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 70px; }
  /* wooden frame, gingham mat, aida cloth */
  .frame {
    padding: 14px; border-radius: 4px;
    background:
      repeating-linear-gradient(92deg, rgba(0,0,0,.08) 0 2px, transparent 2px 7px, rgba(255,255,255,.05) 7px 9px, transparent 9px 15px),
      linear-gradient(135deg, #8a5733, var(--wood) 45%, #54321c);
    box-shadow: 0 12px 26px rgba(59, 42, 32, .35), inset 0 0 0 2px rgba(255,255,255,.12), inset 0 0 0 5px rgba(0,0,0,.18);
  }
  .mat {
    padding: 10px; background-color: #fff;
    background-image: linear-gradient(90deg, rgba(122, 46, 46, .55) 50%, transparent 50%), linear-gradient(rgba(122, 46, 46, .55) 50%, transparent 50%);
    background-size: 12px 12px; box-shadow: inset 0 2px 6px rgba(0,0,0,.3);
  }
  .sampler {
    position: relative; text-align: center; padding: 18px 16px 18px;
    background-color: var(--aida);
    background-image: repeating-linear-gradient(0deg, rgba(120, 95, 60, .09) 0 1px, transparent 1px 5px), repeating-linear-gradient(90deg, rgba(120, 95, 60, .09) 0 1px, transparent 1px 5px);
  }
  .sampler::before { content: ""; position: absolute; inset: 7px; border: 2px dashed rgba(51, 80, 58, .55); pointer-events: none; }
  header { margin: 8px 0 22px; }
  .stitch-row { display: flex; justify-content: space-between; align-items: center; padding: 0 6px; }
  .stitch-row svg, .motif svg { flex: none; display: block; }
  .eyebrow { font-family: "Satisfy", cursive; font-size: 1.5rem; color: var(--red); margin: 10px 0 0; line-height: 1; }
  h1 { font-family: "Libre Baskerville", Georgia, serif; font-size: 1.9rem; margin: 4px 0 0; line-height: 1.15; }
  h1 em { color: var(--red); }
  .sub { color: var(--muted); margin: 6px 0 12px; font-style: italic; font-size: .92rem; }
  .motif { display: flex; justify-content: center; align-items: flex-end; gap: 8px; margin: 0 0 12px; }
  h2 { font-family: "Satisfy", cursive; font-weight: 400; color: var(--hunter); font-size: 1.75rem; margin: 26px 0 8px; display: flex; align-items: center; gap: 12px; }
  h2::before, h2::after { content: ""; flex: 1; border-top: 2px dashed rgba(122, 46, 46, .45); }

  /* cards are fabric patches with a stitched edge */
  .card { position: relative; background: var(--card); border-radius: 6px; box-shadow: 0 2px 0 rgba(59, 42, 32, .15), 0 0 0 1px #e3d3b3, var(--shadow); padding: 18px 16px; }
  .card::after { content: ""; position: absolute; inset: 5px; border: 1.5px dashed #d2bd96; border-radius: 4px; pointer-events: none; }

  /* ---- Today ---- */
  .today { text-align: center; }
  .today .q { font-size: 1.05rem; margin: 0 0 12px; }
  .btn { font: inherit; border: 0; border-radius: 8px; padding: 12px 16px; cursor: pointer; font-weight: 600; }
  .btn:active { transform: scale(.98); }
  .btn-sew { background: var(--red); color: #fff; font-size: 1.1rem; width: 100%; padding: 15px 16px; box-shadow: 0 3px 0 #4f1c1c; }
  .btn-sew[disabled] { background: #c9b9a2; box-shadow: none; cursor: default; }
  .btn-soft { background: #efe5d1; color: var(--ink); }
  .btn-navy { background: var(--navy); color: #fff; }
  .done-msg { font-family: "Libre Baskerville", serif; font-size: 1.1rem; margin: 2px 0 4px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .stat { border-radius: 4px; padding: 8px 4px; border: 1.5px dashed rgba(51, 80, 58, .45); background-color: #fff; background-image: linear-gradient(90deg, rgba(51, 80, 58, .09) 50%, transparent 50%), linear-gradient(rgba(51, 80, 58, .09) 50%, transparent 50%); background-size: 10px 10px; }
  .stat b { display: block; font-family: "Libre Baskerville", serif; font-size: 1.35rem; }
  .stat span { font-size: .78rem; color: var(--muted); }

  /* ---- Month block ---- */
  .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .month-nav button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 1.3rem; cursor: pointer; color: var(--ink); }
  .month-nav button[disabled] { opacity: .3; }
  .month-title { text-align: center; }
  .month-title b { font-family: "Libre Baskerville", serif; font-size: 1.3rem; display: block; }
  .month-title span { color: var(--muted); font-style: italic; font-size: .9rem; }

  .block { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); aspect-ratio: 1; gap: 0; position: relative; }
  .big-block { width: 100%; max-width: 440px; margin: 0 auto; border: 6px solid var(--muslin); box-shadow: 0 0 0 2px #cdb995, var(--shadow); background: var(--muslin); }
  .patch { position: relative; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; background: var(--muslin); }
  .patch.sewn { box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .25), inset 0 -2px 4px rgba(0, 0, 0, .12), inset 0 2px 3px rgba(255, 255, 255, .18); }
  /* hand-quilted stitch line inside every sewn patch */
  .patch.sewn::after { content: ""; position: absolute; inset: 14%; border: 1px dashed rgba(255, 250, 235, .55); border-radius: 1px; pointer-events: none; }
  .mini .patch.sewn::after { display: none; }
  .patch.open { background: var(--muslin); box-shadow: inset 0 0 0 .5px #d8c8a8; }
  .big-block .patch.open::before { content: ""; position: absolute; inset: 10%; border: 1.5px dashed #c8b48f; border-radius: 2px; }
  .big-block .patch { cursor: pointer; }
  .big-block .patch.future { cursor: default; }
  .big-block .patch.future::before { border-color: #e2d6be; }
  .big-block .patch.spare { cursor: default; }
  .num { position: absolute; top: 3px; left: 4px; font-size: .72rem; line-height: 1; padding: 2px 3px; border-radius: 3px; color: var(--muted); z-index: 1; }
  .sewn .num { background: rgba(251, 246, 234, .88); color: var(--ink); }
  .future .num { opacity: .45; }
  .patch.today { z-index: 2; }
  .patch.today.open { animation: pulse 1.6s ease-in-out infinite; }
  .patch.today.open::before { border-color: var(--red); border-width: 2px; }
  @keyframes pulse { 0%, 100% { box-shadow: inset 0 0 0 2px rgba(166, 58, 47, .15); } 50% { box-shadow: inset 0 0 0 4px rgba(166, 58, 47, .45); } }
  /* folded corner = this day has a note */
  .patch .note-dot, .note-key { position: absolute; bottom: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 0 14px 14px; border-color: transparent transparent #fbf6ea transparent; filter: drop-shadow(-1px -1px 0 rgba(0,0,0,.25)); z-index: 1; }
  .legend .note-key { position: relative; display: inline-block; vertical-align: -2px; margin-right: 6px; border-color: transparent transparent #a63a2f transparent; filter: none; border-radius: 0; width: 0; height: 0; }
  .patch.just-sewn { animation: sew .6s cubic-bezier(.2, 1.6, .4, 1); z-index: 3; }
  @keyframes sew { 0% { transform: scale(.4) rotate(-8deg); opacity: .2; } 100% { transform: none; opacity: 1; } }

  .medallion { grid-row: 3 / 5; grid-column: 3 / 5; position: relative; display: flex; align-items: center; justify-content: center; text-align: center; color: #fbf3df; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.3), inset 0 -3px 6px rgba(0,0,0,.18); }
  .medallion::after { content: ""; position: absolute; inset: 8%; border: 1.5px dashed rgba(251, 243, 223, .7); }
  .medallion b { font-family: "Libre Baskerville", serif; font-style: italic; font-weight: 400; font-size: 1.5rem; text-shadow: 0 1px 2px rgba(0,0,0,.35); position: relative; z-index: 1; }
  .mini .medallion b { font-size: .62rem; }
  .mini .medallion::after { inset: 10%; border-width: 1px; }

  .legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: .82rem; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; border-radius: 2px; }

  /* ---- Whole quilt ---- */
  .quilt-frame { max-width: 520px; margin: 0 auto; }
  .quilt-frame .inner { background: var(--navy); padding: 5px; }
  .quilt-border { padding: 10px; position: relative; }
  .quilt-border::after { content: ""; position: absolute; inset: 4px; border: 1px dashed rgba(255,255,255,.45); pointer-events: none; }
  .quilt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; position: relative; }
  .mini { cursor: pointer; border: 0; padding: 0; background: var(--muslin); outline: 1px dashed rgba(255, 245, 225, .6); outline-offset: 2px; }
  .mini.selected { outline: 2px solid var(--gold); outline-offset: 3px; }
  .mini .patch.open { box-shadow: inset 0 0 0 .5px #e0d2b6; }
  .quilt-caption { text-align: center; color: var(--muted); font-size: .88rem; margin: 12px auto 0; font-style: italic; background: var(--card); border: 1.5px dashed #d2bd96; border-radius: 6px; padding: 6px 12px; width: fit-content; max-width: 100%; }
  .row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }

  /* ---- Skipped list ---- */
  .skips { list-style: none; margin: 0; padding: 0; }
  .skips li { display: flex; gap: 10px; align-items: baseline; padding: 10px 2px; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .skips li:last-child { border-bottom: 0; }
  .skips .d { color: var(--muted); font-size: .85rem; min-width: 52px; }
  .skips .t { flex: 1; }
  .skips .a { font-weight: 600; color: var(--red); }
  .total { display: flex; justify-content: space-between; font-family: "Libre Baskerville", serif; padding-top: 10px; margin-top: 4px; border-top: 2px solid var(--line); }
  .empty { color: var(--muted); font-style: italic; text-align: center; margin: 4px 0; }

  .backup p { margin: 0 0 12px; color: var(--muted); text-align: center; }

  /* ---- Sheet ---- */
  .overlay { position: fixed; inset: 0; background: rgba(40, 28, 18, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .sheet { background: var(--card); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgba(0,0,0,.2); animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h3 { font-family: "Libre Baskerville", serif; margin: 0 0 4px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
  .sheet .swatch { width: 34px; height: 34px; border-radius: 4px; flex: none; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.3); }
  .sheet p { margin: 0 0 12px; color: var(--muted); }
  .sheet label { display: block; font-size: .9rem; margin: 10px 0 4px; }
  .sheet input { font: inherit; width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .money { position: relative; }
  .money span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .money input { padding-left: 26px; }
  .sheet .actions { display: grid; gap: 8px; margin-top: 16px; }
  .link-btn { background: none; border: 0; font: inherit; color: var(--muted); text-decoration: underline; padding: 8px; cursor: pointer; }

  /* ---- Toast / banner / celebration ---- */
  .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fbf3df; padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); z-index: 60; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
  .toast button { background: none; border: 0; color: var(--gold); font: inherit; font-weight: 600; cursor: pointer; }
  .banner { background: var(--navy); color: #fff; padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; text-align: center; }
  .banner.warn { background: #8a3b12; }
  .banner button { font: inherit; border: 0; background: #fff; color: var(--navy); border-radius: 8px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
  .notice { background: #f6ecd6; border: 1px dashed #cfb486; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; text-align: center; }
  .notice b { font-family: "Libre Baskerville", serif; }
  .bit { position: fixed; pointer-events: none; z-index: 70; width: 14px; height: 14px; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.25); animation: float 1.4s ease-out forwards; }
  .badge { width: 72px; height: 72px; margin: 4px auto 10px; border-radius: 4px; position: relative; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.3), 0 3px 8px rgba(0,0,0,.2); }
  .badge::after { content: ""; position: absolute; inset: 9px; border: 1.5px dashed rgba(255, 250, 235, .75); }
  @keyframes float { to { transform: translate(var(--dx), -180px) rotate(var(--rot)); opacity: 0; } }
  .celebrate { position: fixed; inset: 0; z-index: 80; background: rgba(40, 28, 18, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .celebrate .card { text-align: center; max-width: 340px; animation: up .3s ease-out; }
  .celebrate h3 { font-family: "Libre Baskerville", serif; margin: 6px 0; }
  .celebrate p { color: var(--muted); margin: 0 0 14px; }
  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
<div id="banner" class="banner hidden"><span id="bannerMsg"></span><button id="bannerBtn" class="hidden"></button></div>

<div class="wrap">
  <header class="frame"><div class="mat"><div class="sampler">
    <div class="stitch-row" id="topRow" aria-hidden="true"></div>
    <p class="eyebrow" id="yearEyebrow">My 2027 Resolution</p>
    <h1>The No-Spend <em>Quilt</em></h1>
    <p class="sub">One patch for every day I don’t buy something I don’t need.</p>
    <div class="motif" id="motif" aria-hidden="true"></div>
    <div class="stitch-row" id="bottomRow" aria-hidden="true"></div>
  </div></div></header>

  <div id="notice" class="notice hidden"></div>

  <section class="card today" id="todayCard"></section>

  <h2 id="monthHeading">This month’s block</h2>
  <section class="card">
    <div class="month-nav">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <div class="month-title"><b id="monthName"></b><span id="monthPattern"></span></div>
      <button id="nextMonth" aria-label="Next month">›</button>
    </div>
    <div id="bigBlock" class="block big-block"></div>
    <div class="legend">
      <span><i style="background: var(--muslin); box-shadow: inset 0 0 0 1px #c8b48f;"></i>Not sewn yet</span>
      <span><i class="note-key"></i>Has a note</span>
    </div>
  </section>

  <h2>The whole quilt</h2>
  <div class="quilt-frame frame"><div class="inner">
    <div class="quilt-border" id="quiltBorder">
      <div class="quilt" id="quilt"></div>
    </div>
  </div></div>
  <p class="quilt-caption" id="quiltCaption"></p>
  <div class="row-btns">
    <button class="btn btn-soft" id="previewBtn">Peek at the finished quilt</button>
  </div>

  <h2>Things I didn’t buy</h2>
  <section class="card" id="skipsCard"></section>

  <h2>Backup</h2>
  <section class="card backup">
    <p>Your quilt is saved on this phone. Save a backup now and then, and before clearing browsing data.</p>
    <div class="row-btns" style="margin-top:0">
      <button class="btn btn-navy" id="backupBtn">Save backup</button>
      <button class="btn btn-soft" id="restoreBtn">Restore backup</button>
    </div>
    <input type="file" id="restoreFile" accept=".json,application/json,text/plain" class="hidden">
  </section>
</div>

<div id="overlay" class="overlay hidden"></div>

<script>
(function () {
  var KEY = 'nospend-quilt';
  var YEAR = 2027;
  var $ = function (id) { return document.getElementById(id); };

  // ---------- Fabrics ----------
  var C = {
    red: '#a63a2f', rust: '#b5612f', rose: '#c9776b', pink: '#e2a6a0', plum: '#6e3b57',
    navy: '#22304f', indigo: '#2f4a73', sky: '#8fb1c9', teal: '#4c7c78',
    forest: '#3f5e3b', sage: '#7d9467', mustard: '#d9a441', butter: '#ead28c',
    brown: '#7a4f33', cream: '#f4ead5', white: '#fbf6ea'
  };
  function F(type, a, b, c) { return { type: type, a: a, b: b || C.cream, c: c || C.cream }; }
  function fabricCSS(f) {
    var a = f.a, b = f.b, c = f.c;
    switch (f.type) {
      case 'solid':
        return 'background:' + a;
      case 'calico': // tiny scattered print
        return 'background-color:' + a + ';background-image:radial-gradient(' + b + ' 1.1px,transparent 1.6px),radial-gradient(' + c + ' .9px,transparent 1.4px);background-size:9px 9px,9px 9px;background-position:0 0,4.5px 4.5px';
      case 'floral': // little flower clusters
        return 'background-color:' + a + ';background-image:radial-gradient(circle at 50% 50%,' + c + ' 1.2px,transparent 1.5px),radial-gradient(circle at 50% 50%,' + b + ' 2.6px,transparent 3px),radial-gradient(' + c + ' .8px,transparent 1.2px);background-size:14px 14px,14px 14px,14px 14px;background-position:0 0,0 0,7px 7px';
      case 'gingham':
        return 'background-color:' + C.white + ';background-image:linear-gradient(90deg,' + a + '88 50%,transparent 50%),linear-gradient(' + a + '88 50%,transparent 50%);background-size:8px 8px';
      case 'polka':
        return 'background-color:' + a + ';background-image:radial-gradient(' + b + ' 1.8px,transparent 2.3px);background-size:10px 10px';
      case 'ticking': // narrow stripes
        return 'background-color:' + b + ';background-image:repeating-linear-gradient(90deg,' + a + ' 0 2.5px,transparent 2.5px 7px)';
      case 'plaid':
        return 'background-color:' + a + ';background-image:repeating-linear-gradient(0deg,' + b + '66 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,' + b + '66 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,' + c + '33 4px 6px,transparent 6px 9px)';
      case 'shirting': // pale background, small print
        return 'background-color:' + C.white + ';background-image:radial-gradient(' + a + ' 1px,transparent 1.4px);background-size:7px 7px';
    }
    return 'background:' + a;
  }

  // ---------- The 12 blocks ----------
  // role(r, c) picks which of the block's 3 fabrics a square is cut from (6x6 grid, centre 2x2 is the medallion).
  var fl = Math.floor, ab = Math.abs;
  var MONTHS = [
    { name: 'January', pattern: 'Nine Patch',
      role: function (r, c) { return (fl(r / 2) + fl(c / 2)) % 2 ? 1 : (r + c) % 2 ? 2 : 0; },
      fab: [F('calico', C.indigo, C.cream, C.sky), F('shirting', C.indigo), F('gingham', C.sky)], med: F('solid', C.navy) },
    { name: 'February', pattern: 'Sweetheart',
      role: function (r, c) { return [0, 1, 2][fl(ab(r - 2.5) + ab(c - 2.5)) % 3]; },
      fab: [F('floral', C.red, C.pink, C.cream), F('shirting', C.rose), F('polka', C.rose, C.cream)], med: F('solid', C.red) },
    { name: 'March', pattern: 'Checkerboard',
      role: function (r, c) { return (r + c) % 2 ? 1 : (r % 4 < 2 ? 0 : 2); },
      fab: [F('calico', C.forest, C.butter, C.cream), F('shirting', C.forest), F('gingham', C.sage)], med: F('solid', C.forest) },
    { name: 'April', pattern: 'Log Cabin',
      role: function (r, c) { return fl(Math.max(ab(r - 2.5), ab(c - 2.5))) === 2 ? 0 : 2 - (r < 3 ? 0 : 1); },
      fab: [F('ticking', C.sky, C.white), F('floral', C.pink, C.rose, C.white), F('calico', C.butter, C.sage, C.white)], med: F('solid', C.sage) },
    { name: 'May', pattern: 'Irish Chain',
      role: function (r, c) { return (r === c || r + c === 5) ? 0 : (r + c) % 2 ? 1 : 2; },
      fab: [F('calico', C.sage, C.cream, C.butter), F('shirting', C.sage), F('floral', C.butter, C.rose, C.white)], med: F('solid', C.forest) },
    { name: 'June', pattern: 'Pinwheel',
      role: function (r, c) { var i = r % 3, j = c % 3, t; if (r < 3 && c >= 3) { t = i; i = j; j = 2 - t; } else if (r >= 3 && c >= 3) { i = 2 - i; j = 2 - j; } else if (r >= 3 && c < 3) { t = i; i = 2 - j; j = t; } return i > j ? 0 : i < j ? 1 : 2; },
      fab: [F('floral', C.sky, C.white, C.butter), F('shirting', C.indigo), F('calico', C.butter, C.indigo, C.white)], med: F('solid', C.indigo) },
    { name: 'July', pattern: 'Ohio Star',
      role: function (r, c) { return (r === 2 || r === 3 || c === 2 || c === 3) ? 0 : (r + c) % 2 ? 1 : 2; },
      fab: [F('polka', C.red, C.white), F('shirting', C.navy), F('calico', C.navy, C.white, C.sky)], med: F('solid', C.navy) },
    { name: 'August', pattern: 'Streak of Lightning',
      role: function (r, c) { return (r + c) % 3; },
      fab: [F('floral', C.teal, C.butter, C.white), F('shirting', C.teal), F('calico', C.mustard, C.brown, C.white)], med: F('solid', C.teal) },
    { name: 'September', pattern: 'Courthouse Steps',
      role: function (r, c) { return ab(r - 2.5) > ab(c - 2.5) ? 0 : ab(r - 2.5) < ab(c - 2.5) ? 1 : 2; },
      fab: [F('plaid', C.mustard, C.brown, C.red), F('calico', C.rust, C.butter, C.cream), F('shirting', C.brown)], med: F('solid', C.brown) },
    { name: 'October', pattern: 'Barn Raising',
      role: function (r, c) { var d = (r < 3) === (c < 3) ? r + c : r + (5 - c); return [0, 1, 0, 2, 1, 2][d % 6]; },
      fab: [F('calico', C.rust, C.butter, C.cream), F('plaid', C.brown, C.mustard, C.cream), F('shirting', C.rust)], med: F('solid', C.rust) },
    { name: 'November', pattern: 'Bow Tie',
      role: function (r, c) { var q = (r < 3) === (c < 3); var corner = Math.min(r % 3, 2 - r % 3) + Math.min(c % 3, 2 - c % 3); return q ? (corner ? 2 : 0) : 1; },
      fab: [F('floral', C.plum, C.rose, C.butter), F('shirting', C.plum), F('calico', C.mustard, C.plum, C.cream)], med: F('solid', C.plum) },
    { name: 'December', pattern: 'Christmas Star',
      role: function (r, c) { return (r === c || r + c === 5) ? 0 : (r === 2 || r === 3 || c === 2 || c === 3) ? 1 : 2; },
      fab: [F('polka', C.red, C.white), F('calico', C.forest, C.white, C.red), F('plaid', C.red, C.forest, C.white)], med: F('solid', C.forest) }
  ];
  var MON_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  // Squares in sewing order: row by row, skipping the centre medallion.
  var SLOTS = [];
  for (var r = 0; r < 6; r++) for (var c = 0; c < 6; c++) if (!((r === 2 || r === 3) && (c === 2 || c === 3))) SLOTS.push([r, c]);

  // ---------- Dates ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function key(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function daysIn(m) { return new Date(YEAR, m + 1, 0).getDate(); }
  function now() {
    var q = location.search.match(/[?&]date=(\d{4})-(\d{2})-(\d{2})/); // for testing
    var t = q ? new Date(+q[1], +q[2] - 1, +q[3]) : new Date();
    return new Date(t.getFullYear(), t.getMonth(), t.getDate());
  }
  var TODAY = now();
  var TODAY_KEY = key(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  var START = new Date(YEAR, 0, 1), END = new Date(YEAR, 11, 31);
  var phase = TODAY < START ? 'before' : TODAY > END ? 'after' : 'during';
  function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function canSew(k) { var d = parseKey(k); return d >= START && d <= TODAY && d <= END; }
  function prettyDate(k, withDay) {
    var d = parseKey(k);
    return (withDay ? WEEKDAYS[d.getDay()] + ', ' : '') + MONTHS[d.getMonth()].name + ' ' + d.getDate();
  }

  // ---------- State ----------
  var state = load();
  var preview = false;
  var month = phase === 'during' ? TODAY.getMonth() : phase === 'after' ? 11 : 0;

  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!s || typeof s !== 'object' || !s.days) s = { v: 1, year: YEAR, days: {} };
    return s;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function isSewn(k) { return preview || !!state.days[k]; }

  function sewnCount() { return Object.keys(state.days).length; }
  function streak() {
    var d = new Date(Math.min(TODAY, END));
    if (!state.days[key(d.getFullYear(), d.getMonth(), d.getDate())]) d.setDate(d.getDate() - 1);
    var n = 0;
    while (d >= START && state.days[key(d.getFullYear(), d.getMonth(), d.getDate())]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function savedTotal() {
    var t = 0;
    for (var k in state.days) t += +state.days[k].amt || 0;
    return t;
  }
  function money(n) { return '$' + (Math.round(n * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }

  // ---------- Rendering ----------
  function patchInfo(m, i) {
    var mo = MONTHS[m], rc = SLOTS[i], f = mo.fab[mo.role(rc[0], rc[1])];
    return { r: rc[0], c: rc[1], fabric: f, day: i < daysIn(m) ? i + 1 : 0 };
  }

  function buildBlock(el, m, big) {
    var html = '', mo = MONTHS[m], full = true;
    for (var d = 1; d <= daysIn(m); d++) if (!isSewn(key(YEAR, m, d))) { full = false; break; }
    for (var i = 0; i < SLOTS.length; i++) {
      var p = patchInfo(m, i);
      var style = 'grid-row:' + (p.r + 1) + ';grid-column:' + (p.c + 1) + ';';
      if (!p.day) { // spare square (short months): fills in once the whole month is sewn
        html += full ? '<div class="patch sewn spare" style="' + style + fabricCSS(p.fabric) + '"></div>'
                     : '<div class="patch spare" style="' + style + 'background:var(--muslin)"></div>';
        continue;
      }
      var k = key(YEAR, m, p.day), sewn = isSewn(k), cls = 'patch ' + (sewn ? 'sewn' : 'open');
      if (!canSew(k) && !sewn) cls += ' future';
      if (k === TODAY_KEY) cls += ' today';
      if (!sewn) style += '';
      else style += fabricCSS(p.fabric);
      if (big) {
        var note = sewn && !preview && state.days[k] && state.days[k].note ? '<span class="note-dot"></span>' : '';
        html += '<button class="' + cls + '" style="' + style + '" data-k="' + k + '" aria-label="' + prettyDate(k) + (sewn ? ', sewn' : '') + '">' +
          '<span class="num">' + p.day + '</span>' + note + '</button>';
      } else {
        html += '<div class="' + cls + '" style="' + style + '"></div>';
      }
    }
    html += '<div class="medallion" style="' + fabricCSS(mo.med) + '"><b>' + (big ? mo.name : MON_SHORT[m]) + '</b></div>';
    el.innerHTML = html;
  }

  function renderToday() {
    var el = $('todayCard'), html = '';
    if (preview) {
      html = '<p class="done-msg">This is your quilt on December 31</p><p class="q" style="color:var(--muted)">365 patches, 12 blocks. Keep going!</p>' +
        '<button class="btn btn-sew" id="endPreview">Back to my quilt</button>';
    } else if (phase === 'before') {
      var days = Math.round((START - TODAY) / 86400000);
      html = '<p class="done-msg">Your quilt starts January 1</p><p class="q" style="color:var(--muted)">' + days + ' day' + (days === 1 ? '' : 's') + ' to go. You’ll sew your first patch on New Year’s Day.</p>' +
        '<button class="btn btn-sew" disabled>Sew today’s patch</button>';
    } else if (phase === 'after') {
      html = '<p class="done-msg">Your ' + YEAR + ' quilt is finished!</p><p class="q" style="color:var(--muted)">You sewed ' + sewnCount() + ' of 365 patches.</p>';
    } else if (state.days[TODAY_KEY]) {
      html = '<p class="done-msg">Today’s patch is sewn</p><p class="q" style="color:var(--muted)">Nice work. See you tomorrow.</p>' +
        '<button class="btn btn-soft" id="todayDetails" style="width:100%">' + (state.days[TODAY_KEY].note ? 'Edit today’s note' : 'Add what I didn’t buy') + '</button>';
    } else {
      html = '<p class="q">Did you get through today without buying anything you didn’t need?</p>' +
        '<button class="btn btn-sew" id="sewToday">Yes! Sew today’s patch</button>';
    }
    if (!preview && phase !== 'before') {
      html += '<div class="stats">' +
        '<div class="stat"><b>' + streak() + '</b><span>day streak</span></div>' +
        '<div class="stat"><b>' + sewnCount() + '</b><span>patches sewn</span></div>' +
        '<div class="stat"><b>' + money(savedTotal()) + '</b><span>not spent</span></div></div>';
    }
    el.innerHTML = html;
    if ($('sewToday')) $('sewToday').onclick = function (e) { openSheet(TODAY_KEY, true, e.currentTarget); };
    if ($('todayDetails')) $('todayDetails').onclick = function () { openSheet(TODAY_KEY); };
    if ($('endPreview')) $('endPreview').onclick = function () { setPreview(false); };
  }

  function renderMonth() {
    var mo = MONTHS[month];
    $('monthName').textContent = mo.name;
    var sewnHere = 0, n = daysIn(month);
    for (var d = 1; d <= n; d++) if (isSewn(key(YEAR, month, d))) sewnHere++;
    $('monthPattern').textContent = mo.pattern + ' · ' + sewnHere + ' of ' + n + ' sewn';
    $('monthHeading').textContent = phase === 'during' && month === TODAY.getMonth() ? 'This month’s block' : mo.name + '’s block';
    $('prevMonth').disabled = month === 0;
    $('nextMonth').disabled = month === 11;
    buildBlock($('bigBlock'), month, true);
  }

  function renderQuilt() {
    var q = $('quilt');
    if (!q.children.length) {
      for (var m = 0; m < 12; m++) {
        var b = document.createElement('button');
        b.className = 'block mini';
        b.dataset.m = m;
        b.setAttribute('aria-label', MONTHS[m].name + ' block');
        q.appendChild(b);
      }
    }
    for (var i = 0; i < 12; i++) {
      buildBlock(q.children[i], i, false);
      q.children[i].classList.toggle('selected', i === month);
    }
    // Sashing between the blocks and the border, cut from classic prints
    q.setAttribute('style', fabricCSS(F('calico', C.red, C.cream, C.butter)));
    $('quiltBorder').setAttribute('style', fabricCSS(F('shirting', C.navy)));
    var n = preview ? 365 : sewnCount();
    $('quiltCaption').textContent = n + ' of 365 patches sewn · tap a block to see it up close';
  }

  function renderSkips() {
    var el = $('skipsCard');
    var ks = Object.keys(state.days).filter(function (k) { var d = state.days[k]; return d.note || d.amt; }).sort().reverse();
    if (!ks.length) {
      el.innerHTML = '<p class="empty">When you talk yourself out of something, add it to that day’s patch. It’ll show up here with a running total.</p>';
      return;
    }
    var html = '<ul class="skips">';
    ks.forEach(function (k) {
      var d = state.days[k], dt = parseKey(k);
      html += '<li data-k="' + k + '"><span class="d">' + MON_SHORT[dt.getMonth()] + ' ' + dt.getDate() + '</span><span class="t">' + esc(d.note || 'Something I didn’t need') + '</span>' +
        (d.amt ? '<span class="a">' + money(+d.amt) + '</span>' : '') + '</li>';
    });
    html += '</ul><div class="total"><span>Money not spent</span><b>' + money(savedTotal()) + '</b></div>';
    el.innerHTML = html;
  }

  function renderNotice() {
    var el = $('notice');
    if (preview) { el.innerHTML = '<b>Preview</b> · This is what every patch sewn looks like. Nothing is saved.'; el.classList.remove('hidden'); }
    else el.classList.add('hidden');
  }

  function render() { renderNotice(); renderToday(); renderMonth(); renderQuilt(); renderSkips(); }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }

  // ---------- Patch sheet ----------
  function openSheet(k, sewNow, fromEl) {
    if (preview) return;
    var d = parseKey(k), m = d.getMonth(), p = patchInfo(m, d.getDate() - 1);
    var sewn = !!state.days[k], rec = state.days[k] || {};
    var isToday = k === TODAY_KEY;
    var title = isToday ? 'Today · ' + prettyDate(k) : prettyDate(k, true);
    var html = '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<h3><span class="swatch" style="' + fabricCSS(p.fabric) + '"></span>' + esc(title) + '</h3>';
    if (sewn) html += '<p>Patch sewn. Did you talk yourself out of something?</p>';
    else html += '<p>' + (isToday ? 'Didn’t buy anything you didn’t need today?' : 'Did you get through this day without buying anything you didn’t need?') + ' Sew the patch.</p>';
    html += '<label for="noteIn">What I didn’t buy <span style="color:var(--muted)">(optional)</span></label>' +
      '<input id="noteIn" maxlength="80" placeholder="e.g. another candle from Target" value="' + esc(rec.note || '') + '">' +
      '<label for="amtIn">About how much? <span style="color:var(--muted)">(optional)</span></label>' +
      '<div class="money"><span>$</span><input id="amtIn" inputmode="decimal" placeholder="0" value="' + (rec.amt ? esc(rec.amt) : '') + '"></div>' +
      '<div class="actions">' +
      (sewn ? '<button class="btn btn-navy" id="saveBtn">Save</button>' : '<button class="btn btn-sew" id="saveBtn">Sew this patch</button>') +
      (sewn ? '<button class="link-btn" id="unpickBtn">Unpick this patch</button>' : '') +
      '<button class="link-btn" id="cancelBtn">Cancel</button></div></div>';
    var ov = $('overlay');
    ov.innerHTML = html;
    ov.classList.remove('hidden');
    ov.onclick = function (e) { if (e.target === ov) closeSheet(); };
    $('cancelBtn').onclick = closeSheet;
    $('saveBtn').onclick = function () {
      var note = $('noteIn').value.trim();
      var amt = parseFloat($('amtIn').value.replace(/[^0-9.]/g, ''));
      var r2 = {};
      if (note) r2.note = note;
      if (amt > 0) r2.amt = Math.round(amt * 100) / 100;
      var wasSewn = !!state.days[k];
      var before = { streak: streak(), count: sewnCount() };
      state.days[k] = r2;
      save();
      closeSheet();
      if (!wasSewn) {
        month = m;
        render();
        var el = $('bigBlock').querySelector('[data-k="' + k + '"]');

      } else {
        render();

      }

    if ($('unpickBtn')) $('unpickBtn').onclick = function () {

  }
  function closeSheet() { $('overlay').classList.add('hidden'); $('overlay').innerHTML = ''; }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSheet(); closeCelebrate(); } });

  // ---------- Encouragement ----------
  var CHEERS = ['Another patch in the quilt', 'Stitched!', 'One more square of good choices', 'Look at that fabric', 'Sewn tight. Nice work!', 'Your quilt is growing', 'That’s a keeper.'];
  function cheer(k, before) {
    var d = parseKey(k), m = d.getMonth(), n = daysIn(m), full = true;
    var fab = patchInfo(m, d.getDate() - 1).fabric;
    for (var i = 1; i <= n; i++) if (!state.days[key(YEAR, m, i)]) { full = false; break; }
    var s = streak(), c = sewnCount();
    var STREAKS = { 3: 'Three days in a row!', 7: 'A whole week in a row!', 14: 'Two weeks straight!', 30: '30 days in a row!', 50: '50-day streak!', 100: '100 days in a row!!', 200: '200-day streak!', 365: 'Every single day!' };
    var COUNTS = { 1: 'Your very first patch!', 50: '50 patches sewn!', 100: '100 patches sewn!', 150: '150 patches!', 200: '200 patches!', 250: '250 patches!', 300: '300 patches!', 365: 'Every patch sewn!' };
    if (full) return celebrate(fab, 'The ' + MONTHS[m].name + ' block is done!', 'Every day of ' + MONTHS[m].name + ', sewn into the ' + MONTHS[m].pattern + '. That block is finished.');
    if (COUNTS[c] && c !== before.count) return celebrate(fab, COUNTS[c], c === 1 ? 'The first square of your ' + YEAR + ' quilt. Here we go!' : c + ' days of not buying things you don’t need.');
    if (STREAKS[s] && s > before.streak) return celebrate(fab, STREAKS[s], s + ' patches in a row without a gap.');
    toast(CHEERS[Math.floor(Math.random() * CHEERS.length)]);
  }
  function celebrate(fab, title, text) {
    var div = document.createElement('div');
    div.className = 'celebrate';
    div.id = 'celebrate';
    div.innerHTML = '<div class="card"><div class="badge" style="' + fabricCSS(fab) + '"></div><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p><button class="btn btn-sew">Keep sewing</button></div>';
    div.onclick = closeCelebrate;
    document.body.appendChild(div);
    burst(div.querySelector('.badge'), 16);
  }
  function closeCelebrate() { var c = $('celebrate'); if (c) c.remove(); }
  function burst(el, n) {
    var rect = el.getBoundingClientRect();
    var scraps = [F('calico', C.red), F('gingham', C.indigo), F('polka', C.mustard), F('floral', C.sage, C.butter), F('ticking', C.rose), F('calico', C.navy, C.cream, C.sky)];
    for (var i = 0; i < (n || 8); i++) {
      var s = document.createElement('span');
      s.className = 'bit';
      s.setAttribute('style', fabricCSS(scraps[i % scraps.length]));
      s.style.left = (rect.left + rect.width / 2 - 7) + 'px';
      s.style.top = (rect.top + rect.height / 2 - 7) + 'px';
      s.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px');
      s.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
      s.style.animationDelay = (i * 35) + 'ms';
      document.body.appendChild(s);
      setTimeout(function (x) { x.remove(); }.bind(null, s), 1700);
    }
  }
  var toastTimer;
  function toast(msg, undo) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button>Undo</button>' : '');
    if (undo) t.querySelector('button').onclick = function () { undo(); t.remove(); };
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, undo ? 5000 : 2400);
  }

  function setPreview(on) {
    preview = on;
    $('previewBtn').textContent = on ? 'Back to my quilt' : 'Peek at the finished quilt';
    render();
    if (on) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- Events ----------
  $('bigBlock').addEventListener('click', function (e) {
    var b = e.target.closest('[data-k]');
    if (!b || preview) return;
    var k = b.dataset.k;
    if (!canSew(k) && !state.days[k]) {
      toast(phase === 'before' ? 'Your quilt starts January 1' : 'That day hasn’t happened yet');
      return;
    }
    openSheet(k, !state.days[k]);
  });
  $('quilt').addEventListener('click', function (e) {
    var b = e.target.closest('.mini');
    if (!b) return;
    month = +b.dataset.m;
    renderMonth(); renderQuilt();
    $('monthHeading').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('prevMonth').onclick = function () { if (month > 0) { month--; renderMonth(); renderQuilt(); } };
  $('nextMonth').onclick = function () { if (month < 11) { month++; renderMonth(); renderQuilt(); } };
  $('previewBtn').onclick = function () { setPreview(!preview); };
  $('skipsCard').addEventListener('click', function (e) {
    var li = e.target.closest('li[data-k]');
    if (li) openSheet(li.dataset.k);
  });

  // ---------- Banner (storage warnings / update available) ----------
  function banner(msg, btnText, onBtn, warn) {
    $('bannerMsg').textContent = msg;
    $('bannerBtn').classList.toggle('hidden', !btnText);
    $('bannerBtn').textContent = btnText || '';
    $('bannerBtn').onclick = onBtn || null;
    $('banner').classList.toggle('warn', !!warn);
    $('banner').classList.remove('hidden');
  }
  var canSave = (function () {
    try { localStorage.setItem(KEY + '-test', '1'); var ok = localStorage.getItem(KEY + '-test') === '1'; localStorage.removeItem(KEY + '-test'); return ok; }
    catch (e) { return false; }
  })();
  if (!canSave) banner('This browser isn’t saving your quilt. Turn off private browsing or open it in Safari/Chrome.', null, null, true);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  var VERSION = (document.querySelector('meta[name="app-version"]') || {}).content || '';
  var updateShown = false;
  function checkForUpdate() {
    if (updateShown || !window.fetch || location.protocol === 'file:') return;
    fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (html) {
        var m = html.match(/<meta name="app-version" content="([^"]+)"/);
        if (m && m[1] !== VERSION) {
          updateShown = true;
          banner('A new version of your quilt is ready!', 'Update', function () {
            save();
            location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
          });
        }
      })
      .catch(function () {});
  }
  checkForUpdate();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    checkForUpdate();
    // Left open overnight? Move "today" forward.
    var t = now();
    if (t.getTime() !== TODAY.getTime()) location.reload();
  });

  // ---------- Backup / restore ----------
  $('backupBtn').onclick = function () {
    var data = JSON.stringify(state, null, 2);
    var name = 'no-spend-quilt-' + TODAY_KEY + '.json';
    try {
      var file = new File([data], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
        navigator.share({ files: [file], title: 'No-spend quilt backup' }).catch(function () {});
        return;
      }
    } catch (e) {}
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast('Backup saved');
  };
  $('restoreBtn').onclick = function () { $('restoreFile').click(); };
  $('restoreFile').onchange = function () {
    var f = this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(reader.result); } catch (e) {}
      if (!data || !data.days || typeof data.days !== 'object') { alert('That file isn’t a quilt backup.'); return; }
      if (!confirm('Replace the quilt on this phone with this backup (' + Object.keys(data.days).length + ' patches sewn)?')) return;
      var old = state;
      state = data; save(); render();
      toast('Backup restored', function () { state = old; save(); render(); });
    };
    reader.readAsText(f);
    this.value = '';
  };

  // ---------- Cross-stitch header ----------
  var STITCH = { R: '#7a2e2e', G: '#33503a', N: '#2c3a57', Y: '#c9973a', B: '#6b4226' };
  var ART = {
    heart: ['.RR.RR.', 'RRRRRRR', 'RRRRRRR', '.RRRRR.', '..RRR..', '...R...'],
    heartG: ['.GG.GG.', 'GGGGGGG', 'GGGGGGG', '.GGGGG.', '..GGG..', '...G...'],
    dot: ['......', '......', '..YY..', '..YY..', '......', '......'],
    spool: ['BBBBBBB', '.RRRRR.', '.RRRRR.', '.RRRRR.', '.RRRRR.', 'BBBBBBB'],
    block: ['RR.YRR', 'R.YY.R', '.YRRY.', 'YRRRRY', 'R.YY.R', 'RR.YRR'],
    needle: ['......Y', '.....N.', '....N..', '...N...', '..N....', '.N.....', 'N......'],
    tulip: ['R.R.R', 'RRRRR', '.RRR.', '..G..', 'G.G.G', '.GGG.', '..G..']
  };
  function stitch(name, size) {
    var rows = ART[name], w = rows[0].length, h = rows.length, out = '<svg width="' + w * size + '" height="' + h * size + '" viewBox="0 0 ' + w + ' ' + h + '">';
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var col = STITCH[rows[y][x]];
      if (col) out += '<path d="M' + (x + .12) + ' ' + (y + .12) + 'L' + (x + .88) + ' ' + (y + .88) + 'M' + (x + .88) + ' ' + (y + .12) + 'L' + (x + .12) + ' ' + (y + .88) + '" stroke="' + col + '" stroke-width=".34" stroke-linecap="round"/>';
    }
    return out + '</svg>';
  }
  function stitchRow(id) {
    var h = '';
    for (var i = 0; i < 9; i++) h += stitch(i % 2 ? 'dot' : (i % 4 ? 'heartG' : 'heart'), 3.2);
    $(id).innerHTML = h;
  }
  stitchRow('topRow'); stitchRow('bottomRow');
  $('motif').innerHTML = stitch('tulip', 4.5) + stitch('spool', 5) + stitch('block', 6) + stitch('needle', 4.5) + stitch('tulip', 4.5);

  render();
})();
</script>
</body>
